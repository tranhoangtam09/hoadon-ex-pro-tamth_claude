<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOA DON EX PRO – TAMTH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><h1>HOA DON EX PRO – TAMTH</h1><span class="tag">Xử lý hoàn toàn trên máy của bạn</span></header>
<main>
  <section id="dash" class="dash" aria-label="Thống kê"></section>

  <section class="drop" id="drop">
    <p><strong>Kéo thả hóa đơn vào đây</strong> hoặc <label class="link">chọn tệp<input id="pick" type="file" multiple hidden accept=".xml,.pdf,.jpg,.jpeg,.png,.tif,.tiff,.webp,.zip"></label></p>
    <p class="muted">XML, PDF, JPG, PNG, TIFF, WEBP hoặc ZIP. Lô mới sẽ thay thế lô hiện tại khi xử lý xong.</p>
    <div id="prog" class="prog" hidden><div class="bar"><i id="barfill"></i></div><span id="progtxt"></span><button id="cancel" class="btn">Hủy</button></div>
    <ul id="errs" class="errs"></ul>
  </section>

  <section class="tools">
    <input id="q" type="search" placeholder="Tìm theo tên tệp, đơn vị, MST, số hóa đơn">
    <select id="flt"><option value="">Mọi trạng thái</option></select>
    <button id="delSel" class="btn">Xóa mục đã chọn</button>
    <button id="delUnread" class="btn">Xóa hồ sơ chưa đọc</button>
    <button id="delAll" class="btn danger">Xóa toàn bộ lô</button>
  </section>

  <div class="tablewrap"><table id="tbl"></table></div>
  <p id="empty" class="muted" hidden>Chưa có hóa đơn. Tải một lô để bắt đầu.</p>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
